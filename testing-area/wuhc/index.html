<!DOCTYPE html>
<html lang="pt-BR" style="background-color: #000;" system-use-light-theme="0">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/testing-area/wuhc/Windows.UI.Html.Controls.css">
  <script src="/testing-area/wuhc/Windows.UI.Html.Controls.js"></script>
  <style>
    [system-use-light-theme="0"]:root {
      body {
        background-color: #000;
        color: #fff;
      }
    }

    [system-use-light-theme="1"]:root {
      body {
        background-color: #fff;
        color: #000;
      }
    }

    body {
      font-family: Segoe UI;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100dvw;
      height: 100dvh;
      margin: 0;
    }
  </style>
</head>

<body>
  <div style="display: flex; flex-direction: column;">
    <p>Checking updates...</p>
    <wuhc-progressbar isindeterminate="true" width="1000"></wuhc-progressbar>
    <button is="wuhc-button" content="Cancel" style="align-self: flex-start; margin-block: 8px;"></button>
  </div>
  <div style="display: flex; align-items: center;">
    <wuhc-progressring isactive="true" width="30" foreground="white" style="margin-inline: 8px;"></wuhc-progressring>
    <p>Doing System File Check (SFC)...</p>
  </div>
</body>

</html>
