<!DOCTYPE html>
<html lang="pt-BR" style="background-color: #000;" system-use-light-theme="0">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="Windows.UI.Html.Controls.css">
  <script src="Windows.UI.Html.Controls.js"></script>
  <style>
    [system-use-light-theme="0"]:root {
      body {
        background-color: #000;
        color: #fff;
      }
    }

    [system-use-light-theme="1"]:root {
      body {
        background-color: #fff;
        color: #000;
      }
    }

    body {
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 100dvw;
      height: 100dvh;
      margin: 0;
    }
  </style>
</head>

<body>
  <button is="wuhc-button" content="Botão teste"></button><span>Este botão faz absolutamente nada.</span>

  <wuhc-progressbar isindeterminate="true" width="1000"></wuhc-progressbar>

</html>
