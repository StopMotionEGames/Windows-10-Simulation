      body {
        font-family: "vgafont" !important;
        color: #fff;
        letter-spacing: -1px;
        font-size: 16px;
        line-height: 18px;
        margin: 0;
        padding: 0;
        width: 640px;
        height: 480px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .bbs-container {
        margin: auto;
        width: 300px;
        height: 300px;
        background-color: #33f;
        display: flex;
        /* flex-direction: column; */
      }
      .bbs-tiles {
        margin-block: 1px;
        border: 1px solid #aaa;
        height: -webkit-fill-available;
        padding: 0;
        list-style: none;
        line-height: normal;
        a {
          display: block;
          color: #fdfd8b;
          text-decoration: none;
          padding-block: 1px;
          &:focus {
            outline: none;
            color: #33f;
            background-color: #aaa;
          }
          &:hover {
            background-color: #aaa;
            color: #33f;
          }
        }
      }
      .bbs-body {
        padding: 1px;
        margin: 4px 1px;
        width: 100%;
        border: 1px solid #aaa;
        display: flex;
        flex-direction: column;
      }
      .bbs-title {
        text-align: center;
        padding-block: 4px;
        border: 1px solid #aaa;
      }
      .bbs-foot {
        text-align: center;
        border: 1px solid #aaa;
        padding-block: 4px;

        p {
          margin: 0;
        }
      }
    </style>
  </head>

  <body>
    <div class="bbs-container">
      <div class="bbs-body">
        <div class="bbs-title">Please select page link:</div>
        <ul class="bbs-tiles">
          <li><a href="/" tabindex="0">MAIN:Main-Page</a></li>
          <li><a href="/testing-area/desktop" tabindex="0">TEST:Desktop</a></li>
          <li><a href="/testing-area/winlogon" tabindex="0">TEST:Winlogon</a></li>
        </ul>
        <div class="bbs-foot">
          <p>TAB and SHIFT TAB to move selection</p>
          <p>ENTER to select pege links</p>
          <p>ESC to <i>page</i> using defaults</p>
        </div>
      </div>
    </div>
    <script>
      function updateScale() {
        const contentWidth = document.body.scrollWidth;
        const contentHeight = document.body.scrollHeight;

        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        const scaleX = viewportWidth / contentWidth;
        const scaleY = viewportHeight / contentHeight;

        document.body.style.transform = `scale(${scaleX}, ${scaleY})`;
        document.body.style.transformOrigin = "top left";
      }

      window.addEventListener("DOMContentLoaded", updateScale);
      window.addEventListener("resize", updateScale);
    </script>
  </body>
